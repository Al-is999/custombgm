plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            // 允许在 IDE / gradle runClient 中直接调试
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('run')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // MP3 解码（OGG 用 LWJGL 自带的 stb_vorbis，WAV 用 JDK 自带 JavaSound，均无需额外依赖）
    // 通过 jar-in-jar 打进产物。若你的 Gradle 版本对 jarJar 配置报错，
    // 把下面这行换成 implementation 'javazoom:jlayer:1.0.1' 即可（此时 MP3 需自行提供 jlayer）。
    jarJar(implementation('javazoom:jlayer:1.0.1')) {
        version {
            strictly '[1.0.1, 2.0)'
            prefer '1.0.1'
        }
    }
}

// 把 gradle.properties 里的元数据注入 neoforge.mods.toml
tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: '1.21.1',
            neo_version      : project.neo_version,
            mod_id           : project.mod_id,
            mod_name         : project.mod_name,
            mod_license      : project.mod_license,
            mod_version      : project.mod_version,
            mod_authors      : project.mod_authors,
            mod_issues       : project.mod_issues,
            mod_description  : project.mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}
